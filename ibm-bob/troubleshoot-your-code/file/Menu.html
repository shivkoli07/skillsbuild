<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roast Toast Coast Cafe</title>

    <style>
        @font-face {
            font-family: "Bogart";
            src: url("https://fonts.cdnfonts.com/s/24702/Bogart-Light.woff") format("woff");
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#000;
            font-family:'Bogart',sans-serif;
            display:grid;
            grid-template-columns:1fr 1fr;
            height:100vh;
        }

        .content{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .image-container{
            background-image:url("https://images.unsplash.com/photo-1514066558159-fc8c737ef259?q=80&w=2574&auto=format&fit=crop");
            background-size:cover;
            background-position:center;
            height:100vh;
        }

        .header-container{
            background:wheat;
            width:90%;
            padding:25px;
            border-radius:15px;
            text-align:center;
            margin-bottom:30px;
            box-shadow:0 5px 15px rgba(0,0,0,.5);
        }

        .header-container h1{
            color:#FFCC00;
            font-size:3rem;
            margin-bottom:10px;
        }

        .header-container p{
            color:#222;
            font-size:1.2rem;
        }

        .menu-section{
            width:70%;
            background:#111;
            color:white;
            border-radius:10px;
            padding:20px;
            text-align:center;
            box-shadow:0 0 15px rgba(255,255,255,.15);
        }

        .menu-toggle{
            color:#FFCC00;
            cursor:pointer;
            user-select:none;
            transition:.3s;
        }

        .menu-toggle:hover{
            color:#ff9933;
        }

        .menu-items{
            list-style:none;
            margin-top:20px;

            max-height:0;
            overflow:hidden;
            transition:max-height .5s ease;
        }

        .menu-items.show{
            max-height:300px;
        }

        .menu-items li{
            background:#222;
            margin:10px 0;
            padding:12px;
            border-radius:8px;
            transition:.3s;
        }

        .menu-items li:hover{
            background:#333;
            transform:scale(1.03);
        }

        @media(max-width:768px){

            body{
                grid-template-columns:1fr;
            }

            .image-container{
                height:40vh;
            }

            .content{
                order:2;
            }
        }

    </style>
</head>

<body>

<div class="content">

    <header class="header-container">
        <h1>Welcome to the<br>Roast Toast Coast Cafe!</h1>
        <p>Where flavor meets the shore!</p>
    </header>

    <section class="menu-section">

        <h2 class="menu-toggle" onclick="toggleMenuItems()">
            Our Menu
        </h2>

        <ul class="menu-items">
            <li>☕ Breezy Brews</li>
            <li>🥪 Toasty Delights</li>
            <li>🍔 Coastal Bites</li>
            <li>🍹 Sunset Sips</li>
        </ul>

    </section>

</div>

<div class="image-container"></div>

<script>

function toggleMenuItems(){

    const menuItems = document.querySelector(".menu-items");

    menuItems.classList.toggle("show");

}

</script>

</body>
</html>
